<title>Atlas Weekly Status</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single report column (max 980px) under a sticky week strip; each week is one status report. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#1b2321; --muted:#5d6a66; --line:#dde2df;
  --accent:#0f6b63; --accent-soft:#e1efec;
  --red:#c23b2e; --red-soft:#fbe9e6; --amber:#b7740a; --amber-soft:#fdf1dc; --green:#2c7a3f; --green-soft:#e4f2e6;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --ink:#e6ece9; --muted:#9aa8a3; --line:#2c3633;
  --accent:#4cc2b4; --accent-soft:#173a35;
  --red:#ff7b6b; --red-soft:#3a1f1b; --amber:#f0b04a; --amber-soft:#3a2d14; --green:#6fcf86; --green-soft:#1a3322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --ink:#e6ece9; --muted:#9aa8a3; --line:#2c3633;
  --accent:#4cc2b4; --accent-soft:#173a35;
  --red:#ff7b6b; --red-soft:#3a1f1b; --amber:#f0b04a; --amber-soft:#3a2d14; --green:#6fcf86; --green-soft:#1a3322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.weeks{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.weeks .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.wk{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:6px;padding:6px 12px 7px;font:inherit;cursor:pointer;min-width:112px}
.wk:hover{border-color:var(--accent)}
.wk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wk[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.wk .d{font-family:var(--f-mono);font-size:13px;font-weight:600}
.wk .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.RED{background:var(--red)}.dot.AMBER{background:var(--amber)}.dot.GREEN{background:var(--green)}
main .wrap{padding-block:26px 48px;display:flex;flex-direction:column;gap:34px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;display:flex;align-items:baseline;gap:10px}
h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.status{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.rag{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;padding:6px 12px;border-radius:4px}
.rag.RED{background:var(--red-soft);color:var(--red)}.rag.AMBER{background:var(--amber-soft);color:var(--amber)}.rag.GREEN{background:var(--green-soft);color:var(--green)}
.status .hl{flex:1 1 360px;font-size:18px;font-weight:600;min-width:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
ul.sum{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.up{color:var(--red)}.down{color:var(--green)}
.burn{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.bar{position:relative;height:22px;border-radius:4px;background:var(--bg);display:flex;overflow:hidden}
.bar span{height:100%}
.bar .marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.key{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.sev{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.sev.HIGH{background:var(--red-soft);color:var(--red)}.sev.MEDIUM{background:var(--amber-soft);color:var(--amber)}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:0 4px 3px 0;white-space:nowrap;color:var(--muted)}
.chip.new{border-color:var(--red);color:var(--red)}
.tl{display:flex;gap:4px;flex-wrap:wrap}
.st{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--bg);white-space:nowrap}
.st.Blocked{background:var(--red-soft);color:var(--red)}.st.Done{background:var(--green-soft);color:var(--green)}
.st.In.Review{background:var(--amber-soft);color:var(--amber)}
.muted{color:var(--muted)}
ol.asks{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
ol.asks li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart h3{margin:0;font-size:14px;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: no-preference){.wk{transition:background .15s,border-color .15s}}
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">PM Sprint Status Agent · Weekly report</div>
  <h1>Atlas · Mobile Onboarding v2</h1>
  <div class="meta" id="projmeta"></div>
</div></header>
<nav class="weeks" aria-label="Report week"><div class="wrap" id="weeks"></div></nav>
<main><div class="wrap" id="report"></div></main>

<script>
const REPORTS = /*__REPORTS__*/[];
const NARR = /*__NARR__*/{};
const DEFAULT_ACTION = {
  "Blocker":"Escalate the dependency named in the notes and agree an ETA or a descope decision.",
  "Review stall":"Assign a second reviewer and set a 48-hour review target.",
  "Not started":"Pull it into this week or move it to the backlog explicitly.",
  "Carry-over":"Re-confirm scope and owner at planning.",
  "Overdue":"Re-baseline the due date with the owner.",
  "Over-commitment":"Re-plan to the average velocity.",
  "Scope creep":"Trade out equal points for anything added.",
  "Burndown":"Review burndown daily and cut scope early.",
  "Load":"Rebalance open work across the team."
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const sprintShort = s => s.replace("Sprint ","S");

function delta(now, prev, worseWhenUp){
  if (prev == null) return "";
  const d = now - prev;
  if (d === 0) return `<span class="c">same as last week</span>`;
  const cls = (d > 0) === worseWhenUp ? "up" : "down";
  return `<span class="c ${cls}">${d > 0 ? "▲" : "▼"} ${Math.abs(d)} vs last week</span>`;
}

function velocityChart(r){
  const sprints = Object.keys(r.velocity);
  const committed = {};
  REPORTS.forEach(x => { if (x.committed) committed[x.sprint] = x.committed; });
  if (!sprints.length) return `<p class="muted" style="margin:0">No sprint has closed yet.</p>`;
  const W = 300, H = 150, pad = {l:28,b:22,t:10,r:6};
  const max = 60, y = v => H - pad.b - (v / max) * (H - pad.b - pad.t);
  const bw = 22, gap = (W - pad.l - pad.r) / sprints.length;
  let g = "";
  [0,20,40,60].forEach(t => g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`);
  sprints.forEach((s,i) => {
    const cx = pad.l + gap*i + gap/2;
    const c = committed[s], d = r.velocity[s];
    g += `<rect x="${cx-bw-2}" y="${y(c)}" width="${bw}" height="${y(0)-y(c)}" fill="var(--line)"/>`;
    g += `<rect x="${cx+2}" y="${y(d)}" width="${bw}" height="${y(0)-y(d)}" fill="var(--accent)"/>`;
    g += `<text x="${cx-bw/2-2}" y="${y(c)-4}" text-anchor="middle">${c}</text><text x="${cx+bw/2+2}" y="${y(d)-4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${d}</text>`;
    g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${sprintShort(s)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Committed versus done points per sprint">${g}</svg>
  <div class="legend"><span><i style="background:var(--line)"></i>Committed at planning</span><span><i style="background:var(--accent)"></i>Done at close</span></div>`;
}

function trendChart(r){
  const t = r.trend, n = t.weeks.length;
  const W = 300, H = 150, pad = {l:24,b:22,t:12,r:10}, max = 4;
  const x = i => n === 1 ? (W+pad.l-pad.r)/2 : pad.l + i * (W - pad.l - pad.r) / (n - 1);
  const y = v => H - pad.b - (v / max) * (H - pad.b - pad.t);
  let g = "";
  [0,1,2,3,4].forEach(v => g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`);
  const line = (arr, col) => {
    const pts = arr.map((v,i) => `${x(i)},${y(v)}`).join(" ");
    let s = n > 1 ? `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>` : "";
    arr.forEach((v,i) => s += `<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?4:2.5}" fill="${col}"/>`);
    return s;
  };
  g += line(t.carry, "var(--amber)") + line(t.blocked, "var(--red)");
  t.weeks.forEach((w,i) => g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fmt(w)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Blocked and carried-over items by week">${g}</svg>
  <div class="legend"><span><i style="background:var(--red)"></i>Blocked items</span><span><i style="background:var(--amber)"></i>Open carry-overs</span></div>`;
}

function render(week){
  const r = REPORTS.find(x => x.week === week) || REPORTS[REPORTS.length-1];
  const nr = NARR[r.week] || {summary:[],asks:[],actions:{}};
  const p = r.prev;
  document.querySelectorAll(".wk").forEach(b => b.setAttribute("aria-pressed", b.dataset.week === r.week));
  const rest = r.scope - r.done_pts;
  const st = r.status_pts;
  const seg = (k,col) => st[k] ? `<span style="width:${st[k]/r.scope*100}%;background:${col}" title="${k}: ${st[k]} pts"></span>` : "";
  const actionFor = f => f.issue !== "-" ? (nr.actions[f.issue] || DEFAULT_ACTION[f.types[0]]) : (nr.actions[f.types[0]] || DEFAULT_ACTION[f.types[0]]);
  const timelineCell = s => `<div class="tl">${s.timeline.map(t => `<span class="st ${esc(t.status)}" title="${esc(t.date)}">${fmt(t.date)} · ${esc(t.status)}</span>`).join("")}</div>`;

  document.getElementById("report").innerHTML = `
  <section aria-labelledby="h-sum">
    <div class="status">
      <span class="rag ${r.rag}">${r.rag}</span>
      <div class="hl">${esc(nr.headline || "")}</div>
      <div class="meta" style="flex-basis:100%">
        <span><b>${esc(r.sprint)}</b> (${fmt(r.sprint_start)} – ${fmt(r.sprint_end)}), ${esc(r.kind)}</span>
        <span>Snapshot <b>${fmt(r.week)}</b></span>
        <span>GA <b>${fmt(r.release)}</b> · ${r.days_to_release} days away</span>
      </div>
    </div>
  </section>

  <section aria-labelledby="h-exec">
    <h2 id="h-exec"><span class="n">01</span>Executive summary</h2>
    <ul class="sum">${nr.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <p class="muted" style="margin:0;font-size:14px">Sprint goal: ${esc(r.sprint_goal)}</p>
  </section>

  <section aria-labelledby="h-health">
    <h2 id="h-health"><span class="n">02</span>Sprint health</h2>
    <div class="kpis">
      <div class="kpi"><span class="l">Done</span><span class="v">${r.done_pts}<small> / ${r.scope} pts</small></span><span class="c">${r.done_pct}% done · ${r.elapsed_pct}% of sprint elapsed</span></div>
      <div class="kpi"><span class="l">Committed at planning</span><span class="v">${r.committed}<small> pts</small></span><span class="c">${r.scope_added ? `+${r.scope_added} pts added mid-sprint` : "no mid-sprint adds"}</span></div>
      <div class="kpi"><span class="l">Avg velocity (closed sprints)</span><span class="v">${r.avg_velocity ?? "–"}<small>${r.avg_velocity ? " pts" : ""}</small></span><span class="c">${r.avg_velocity ? `commit is ${(r.committed/r.avg_velocity).toFixed(1)}× velocity` : "first sprint"}</span></div>
      <div class="kpi"><span class="l">Blocked items</span><span class="v">${r.blocked.length}</span>${delta(r.blocked.length, p && p.blocked, true)}</div>
      <div class="kpi"><span class="l">Open carry-overs</span><span class="v">${r.carry_open.length}</span>${delta(r.carry_open.length, p && p.carry, true)}</div>
      <div class="kpi"><span class="l">Open items</span><span class="v">${r.items_open}<small> of ${r.items_total}</small></span><span class="c">${rest} pts still open</span></div>
    </div>
    <div class="burn">
      <div class="bar" role="img" aria-label="Points by status, with a marker at the share of the sprint elapsed">
        ${seg("Done","var(--green)")}${seg("In Review","var(--amber)")}${seg("In Progress","var(--accent)")}${seg("To Do","var(--line)")}${seg("Blocked","var(--red)")}
        <span class="marker" style="left:calc(${Math.min(r.elapsed_pct,100)}% - 1px)"></span>
      </div>
      <div class="legend">
        ${["Done","In Review","In Progress","To Do","Blocked"].filter(k=>st[k]).map(k => `<span><i style="background:${{"Done":"var(--green)","In Review":"var(--amber)","In Progress":"var(--accent)","To Do":"var(--line)","Blocked":"var(--red)"}[k]}"></i>${k} ${st[k]} pts</span>`).join("")}
        <span>▏ ${r.elapsed_pct}% of sprint elapsed</span>
      </div>
    </div>
  </section>

  <section aria-labelledby="h-risk">
    <h2 id="h-risk"><span class="n">03</span>Risk flags <span class="n">${r.flags.length}</span></h2>
    ${r.flags.length ? `<div class="tbl"><table>
      <thead><tr><th>Severity</th><th>Issue</th><th>Type</th><th>Detail</th><th>Recommended action</th><th>Owner</th></tr></thead>
      <tbody>${r.flags.map(f => `<tr>
        <td><span class="sev ${f.sev}">${f.sev}</span></td>
        <td>${f.issue !== "-" ? `<span class="key">${f.issue}</span><br><span class="muted">${esc(f.summary)}</span>` : `<span class="muted">${esc(f.summary)}</span>`}</td>
        <td>${f.types.map(t => `<span class="chip">${t}</span>`).join("")}</td>
        <td>${f.details.map(esc).join("<br>")}</td>
        <td>${esc(actionFor(f))}</td>
        <td style="white-space:nowrap">${esc(f.owner)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">No risks flagged this week.</p>`}
  </section>

  <section aria-labelledby="h-block">
    <h2 id="h-block"><span class="n">04</span>Blockers</h2>
    ${r.blocked.length ? `<div class="tbl"><table>
      <thead><tr><th>Issue</th><th>Owner</th><th>Days blocked</th><th>Waiting on</th></tr></thead>
      <tbody>${r.blocked.map(b => `<tr>
        <td><span class="key">${b.key}</span> ${b.new ? `<span class="chip new">new this week</span>` : ""}<br><span class="muted">${esc(b.summary)} · ${b.pts} pts · ${b.prio}</span></td>
        <td style="white-space:nowrap">${esc(b.owner)}</td><td class="num"><b>${b.days}</b></td><td>${esc(b.note)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">Nothing is blocked.</p>`}
    ${r.resolved_blockers.length ? `<p style="margin:0;font-size:14px"><b>Unblocked since last week:</b> ${r.resolved_blockers.map(k=>`<span class="key">${k}</span>`).join(", ")}</p>` : ""}
  </section>

  <section aria-labelledby="h-stuck">
    <h2 id="h-stuck"><span class="n">05</span>Stuck or carried over</h2>
    ${r.stuck.length ? `<div class="tbl"><table>
      <thead><tr><th>Issue</th><th>Owner</th><th>Sprints</th><th>Weekly snapshots</th></tr></thead>
      <tbody>${r.stuck.map(s => `<tr>
        <td><span class="key">${s.key}</span><br><span class="muted">${esc(s.summary)} · ${s.pts} pts</span></td>
        <td style="white-space:nowrap">${esc(s.owner)}</td><td class="num">${s.sprints.join(" → ")}</td><td>${timelineCell(s)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">No items are stuck or carried over.</p>`}
  </section>

  <section aria-labelledby="h-done">
    <h2 id="h-done"><span class="n">06</span>Completed this week</h2>
    ${r.completed.length ? `<ul class="sum">${r.completed.map(c => `<li><span class="key">${c.key}</span> ${esc(c.summary)} <span class="muted">· ${c.pts} pts · ${esc(c.owner)}${c.type==="Bug"?" · bug":""}</span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Nothing closed this week.</p>`}
  </section>

  <section aria-labelledby="h-trend">
    <h2 id="h-trend"><span class="n">07</span>Trends</h2>
    <div class="charts">
      <div class="chart"><h3>Velocity: committed vs done (pts)</h3>${velocityChart(r)}</div>
      <div class="chart"><h3>Blockers and carry-overs by week</h3>${trendChart(r)}</div>
    </div>
  </section>

  <section aria-labelledby="h-asks">
    <h2 id="h-asks"><span class="n">08</span>Asks and decisions needed</h2>
    <ol class="asks">${nr.asks.map(a => `<li>${esc(a)}</li>`).join("")}</ol>
  </section>

  <footer>Generated by the PM Sprint Status Agent from ${REPORTS.indexOf(r)+1} weekly Jira snapshot${REPORTS.indexOf(r)?"s":""} (${fmt(REPORTS[0].week)} – ${fmt(r.week)}). Source: jira_mock.md. Synthetic demo data; people, vendors and PR numbers are fictional.</footer>`;
}

const strip = document.getElementById("weeks");
strip.innerHTML = REPORTS.map(r => `<button class="wk" type="button" id="wk-${r.week}" data-week="${r.week}" aria-pressed="false">
  <span class="d">${fmt(r.week)}</span><span class="s"><span class="dot ${r.rag}"></span>${sprintShort(r.sprint)} · ${r.kind === "sprint close" ? "close" : "mid"}</span></button>`).join("");
strip.addEventListener("click", e => {
  const b = e.target.closest(".wk"); if (!b) return;
  render(b.dataset.week);
  try { history.replaceState(null, "", "#w" + b.dataset.week); } catch (_) {}
});
document.getElementById("projmeta").innerHTML = `<span>Project key <b>ATL</b></span><span>Team of 6 + PM</span><span>2-week sprints</span><span>Weekly snapshots, Fridays</span>`;
const fromHash = (location.hash || "").replace(/^#w/, "");
render(REPORTS.some(r => r.week === fromHash) ? fromHash : REPORTS[REPORTS.length-1].week);
</script>
